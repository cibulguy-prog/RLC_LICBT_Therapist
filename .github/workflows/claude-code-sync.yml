name: Claude Code Automation

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  workflow_dispatch: # מאפשר הרצה ידנית מתוך לשונית Actions

jobs:
  claude:
    # מורץ רק אם הועלתה קריאה ל-Claude או הרצה ידנית
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.labels.*.name, 'claude')
    runs-on: ubuntu-latest

    permissions:
      contents: write       # הרשאת כתיבה לקוד (Commit/Push)
      pull-requests: write  # הרשאת יצירת Pull Requests
      issues: write         # הרשאת כתיבת תגובות ב-Issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropic/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.API_CLD }}
          prompt: ${{ github.event.comment.body || github.event.issue.body || 'Review and optimize the codebase' }}
